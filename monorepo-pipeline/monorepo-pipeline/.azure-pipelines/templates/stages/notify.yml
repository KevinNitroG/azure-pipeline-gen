parameters:
  - name: environments
    type: object
  - name: deployUpTo
    type: string
  - name: runE2E
    type: boolean

stages:
  - stage: Notify
    displayName: Notify
    # Depends on every stage that exists in this run, and runs no matter what.
    dependsOn:
      - Detect
      - Codegen
      - Quality
      - BuildTest
      - Integration
      - Docs
      - Package
      - ${{ if eq(parameters.runE2E, true) }}:
          - E2E
      - ${{ each env in parameters.environments }}:
          - ${{ if containsValue(env.targets, parameters.deployUpTo) }}:
              - Deploy${{ env.stageName }}
      - ${{ if eq(parameters.deployUpTo, 'prod') }}:
          - Release
    condition: always()
    variables:
      - group: acme-platform-shared
    jobs:
      - job: Teams
        displayName: Post to Teams
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: self
            fetchDepth: 1
          - bash: bash .azure-pipelines/scripts/notify-teams.sh
            displayName: Send summary
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              TEAMS_WEBHOOK_URL: $(teamsWebhookUrl)
              ONLY_ON_FAILURE: ${{ ne(variables['Build.SourceBranch'], 'refs/heads/main') }}
