parameters:
  - name: enableCodeQL
    type: boolean
    default: false

stages:
  - stage: Quality
    displayName: Quality gates
    dependsOn: [Detect, Codegen]
    condition: and(not(failed()), not(canceled()), eq(dependencies.Detect.outputs['Plan.plan.affected_any'], 'true'))
    jobs:
      # ---------------------------------------------------------------- repo-level
      - job: Graph
        displayName: Validate monorepo graph against package.json and csproj
        timeoutInMinutes: 5
        pool:
          vmImage: ubuntu-24.04
        steps:
          - template: ../steps/checkout.yml
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
          - bash: node .azure-pipelines/scripts/validate-graph.js
            displayName: validate-graph.js

      - job: Commits
        displayName: Conventional commits (PR only)
        condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
        pool:
          vmImage: ubuntu-24.04
        steps:
          - template: ../steps/checkout.yml
            parameters:
              fetchDepth: 0
          - template: ../steps/setup-node.yml
            parameters:
              install: false
          - bash: |
              set -euo pipefail
              TARGET="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
              pnpm dlx -p @commitlint/cli -p @commitlint/config-conventional \
                commitlint --from "origin/${TARGET}" --to HEAD --verbose \
                --extends @commitlint/config-conventional
            displayName: commitlint

      # ---------------------------------------------------------------- per-project (dynamic matrices)
      - job: Node
        displayName: Node - format, lint, types, boundaries
        condition: and(succeeded(), ne(stageDependencies.Detect.Plan.outputs['plan.matrix_node'], '{}'))
        strategy:
          maxParallel: 4
          matrix: $[ stageDependencies.Detect.Plan.outputs['plan.matrix_node'] ]
        pool:
          vmImage: ubuntu-24.04
        steps:
          - template: ../steps/checkout.yml
          - template: ../steps/setup-node.yml
            parameters:
              filter: ./$(projectPath)...
          - template: ../steps/download-generated.yml
          - bash: pnpm exec prettier --check "$(projectPath)"
            displayName: Prettier --check
          - bash: pnpm --dir "$(projectPath)" exec eslint . --max-warnings 0
            displayName: ESLint (zero warnings)
          - bash: |
              if [ -f "$(projectPath)/tsconfig.json" ]; then
                pnpm --dir "$(projectPath)" exec tsc --noEmit -p .
              else
                echo "no tsconfig.json - skipping"
              fi
            displayName: Type-check
          - bash: |
              if [ -d "$(projectPath)/src" ]; then
                pnpm exec depcruise "$(projectPath)/src" --config .dependency-cruiser.cjs
              else
                echo "no src/ - skipping"
              fi
            displayName: Dependency boundaries (dependency-cruiser)

      - job: DotNet
        displayName: .NET - format, analyzers
        condition: and(succeeded(), ne(stageDependencies.Detect.Plan.outputs['plan.matrix_dotnet'], '{}'))
        strategy:
          matrix: $[ stageDependencies.Detect.Plan.outputs['plan.matrix_dotnet'] ]
        pool:
          vmImage: ubuntu-24.04
        steps:
          - template: ../steps/checkout.yml
          - template: ../steps/setup-dotnet.yml
          - template: ../steps/download-generated.yml
          - bash: dotnet restore "$(projectSolution)"
            displayName: Restore
          - bash: dotnet format "$(projectSolution)" --verify-no-changes --no-restore --verbosity minimal
            displayName: dotnet format --verify-no-changes
          - bash: dotnet build "$(projectSolution)" -c Release --no-restore -warnaserror -p:EnforceCodeStyleInBuild=true
            displayName: Build with analyzers as errors

      - job: Go
        displayName: Go - fmt, vet, golangci-lint, govulncheck
        condition: and(succeeded(), ne(stageDependencies.Detect.Plan.outputs['plan.matrix_go'], '{}'))
        strategy:
          matrix: $[ stageDependencies.Detect.Plan.outputs['plan.matrix_go'] ]
        pool:
          vmImage: ubuntu-24.04
        steps:
          - template: ../steps/checkout.yml
          - template: ../steps/setup-go.yml
          - template: ../steps/download-generated.yml
          - bash: |
              set -euo pipefail
              unformatted="$(gofmt -l .)"
              if [ -n "$unformatted" ]; then echo "Needs gofmt:"; echo "$unformatted"; exit 1; fi
            displayName: gofmt
            workingDirectory: $(projectPath)
          - bash: go vet ./...
            displayName: go vet
            workingDirectory: $(projectPath)
          - bash: |
              set -euo pipefail
              curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
                | sh -s -- -b "$(go env GOPATH)/bin" v1.62.2
              "$(go env GOPATH)/bin/golangci-lint" run --timeout 5m ./...
            displayName: golangci-lint
            workingDirectory: $(projectPath)
          - bash: |
              set -euo pipefail
              go install golang.org/x/vuln/cmd/govulncheck@latest
              "$(go env GOPATH)/bin/govulncheck" ./...
            displayName: govulncheck
            workingDirectory: $(projectPath)

      - job: Bicep
        displayName: Bicep - build, lint, format, checkov
        condition: and(succeeded(), eq(stageDependencies.Detect.Plan.outputs['plan.affected_infra'], 'true'))
        pool:
          vmImage: ubuntu-24.04
        steps:
          - template: ../steps/checkout.yml
          - bash: |
              set -euo pipefail
              az bicep install
              az bicep build --file infra/main.bicep --stdout > /dev/null
              az bicep lint --file infra/main.bicep
              find infra -name '*.bicep' -print0 | xargs -0 -n1 az bicep format --file
              git diff --exit-code -- infra
            displayName: Build, lint, format check
          - bash: |
              set -euo pipefail
              pip install --quiet checkov==3.2.*
              checkov -d infra --framework bicep --quiet --compact
            displayName: Checkov IaC policy scan

      # ---------------------------------------------------------------- security
      - job: Secrets
        displayName: Secret scan (gitleaks)
        pool:
          vmImage: ubuntu-24.04
        steps:
          - template: ../steps/checkout.yml
          - bash: |
              set -euo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs"
              docker run --rm -v "$PWD:/repo" -v "$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs:/out" \
                zricethezav/gitleaks:v8.21.2 detect --source /repo --no-git --redact --no-banner \
                --report-format sarif --report-path /out/gitleaks.sarif
            displayName: gitleaks
          - publish: $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs
            artifact: CodeAnalysisLogs-gitleaks
            condition: succeededOrFailed()

      - job: Dependencies
        displayName: Dependency vulnerabilities (pnpm, NuGet)
        pool:
          vmImage: ubuntu-24.04
        steps:
          - template: ../steps/checkout.yml
          - template: ../steps/setup-node.yml
            parameters:
              install: false
          - template: ../steps/setup-dotnet.yml
          - bash: pnpm audit --prod --audit-level high
            displayName: pnpm audit (high+)
          - bash: |
              set -euo pipefail
              dotnet restore services/api/Acme.Api.sln
              dotnet list services/api/Acme.Api.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
              ! grep -q "has the following vulnerable packages" vuln.txt
            displayName: dotnet list package --vulnerable

      - job: Trivy
        displayName: Filesystem scan (vuln, misconfig)
        pool:
          vmImage: ubuntu-24.04
        steps:
          - template: ../steps/checkout.yml
          - bash: |
              docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.57.1 fs /src \
                --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
            displayName: trivy fs

      - ${{ if eq(parameters.enableCodeQL, true) }}:
          - job: CodeQL
            displayName: CodeQL (GitHub Advanced Security for Azure DevOps)
            timeoutInMinutes: 90
            pool:
              vmImage: ubuntu-24.04
            steps:
              - template: ../steps/checkout.yml
              - template: ../steps/setup-node.yml
              - template: ../steps/setup-dotnet.yml
              - template: ../steps/setup-go.yml
              - task: AdvancedSecurity-Codeql-Init@1
                inputs:
                  languages: csharp,javascript,go
              - task: AdvancedSecurity-Codeql-Autobuild@1
              - task: AdvancedSecurity-Codeql-Analyze@1
