# =====================================================================================
#  Acme Platform - monorepo CI/CD entry point
#
#  This file only declares: triggers, run-time parameters, variables, resources.
#  The stage graph is in .azure-pipelines/templates/extends/monorepo.yml
#  The project graph is in .azure-pipelines/config/monorepo.graph.json
# =====================================================================================
name: $(Date:yyyyMMdd)$(Rev:.r)   # replaced by the computed semver in Detect/Version

trigger:
  batch: true
  branches:
    include:
      - main
      - release/*
      - hotfix/*
  tags:
    include:
      - v*
  paths:
    exclude:
      - .github/**
      - CODEOWNERS
      - LICENSE

pr:
  autoCancel: true
  drafts: false
  branches:
    include:
      - main
      - release/*
  paths:
    exclude:
      - .github/**
      - CODEOWNERS
      - LICENSE

schedules:
  - cron: '0 1 * * 1-5'
    displayName: Nightly full rebuild (all projects, CodeQL on)
    branches:
      include:
        - main
    always: true

parameters:
  - name: forceAll
    displayName: Ignore change detection and build/test everything
    type: boolean
    default: false
  - name: deployUpTo
    displayName: Furthest environment to promote to
    type: string
    default: prod
    values: [none, dev, staging, prod]
  - name: runE2E
    displayName: Run sharded Playwright E2E
    type: boolean
    default: true
  - name: runLoadTests
    displayName: Run k6 load test in staging
    type: boolean
    default: false
  - name: enableCodeQL
    displayName: Run CodeQL (always on for nightly)
    type: boolean
    default: false
  - name: publishPackages
    displayName: Publish npm / NuGet packages in Release
    type: boolean
    default: true
  - name: deployDocs
    displayName: Deploy docs (PR preview / production)
    type: boolean
    default: true
  - name: verbose
    displayName: Enable system.debug
    type: boolean
    default: false

variables:
  - template: .azure-pipelines/config/variables.yml
  - group: acme-platform-shared        # teamsWebhookUrl, docsSwaToken, ...
  - name: system.debug
    value: ${{ parameters.verbose }}

resources:
  containers:
    # Service containers used by the Integration stage (`services:` on a job)
    - container: postgres
      image: postgres:16-alpine
      env:
        POSTGRES_PASSWORD: ci
        POSTGRES_DB: acme_test
      ports:
        - 5432:5432
      options: >-
        --health-cmd "pg_isready -U postgres"
        --health-interval 5s --health-timeout 5s --health-retries 10
    - container: redis
      image: redis:7-alpine
      ports:
        - 6379:6379
      options: >-
        --health-cmd "redis-cli ping"
        --health-interval 5s --health-timeout 3s --health-retries 10

extends:
  template: .azure-pipelines/templates/extends/monorepo.yml
  parameters:
    forceAll: ${{ parameters.forceAll }}
    deployUpTo: ${{ parameters.deployUpTo }}
    runE2E: ${{ parameters.runE2E }}
    runLoadTests: ${{ parameters.runLoadTests }}
    enableCodeQL: ${{ or(parameters.enableCodeQL, eq(variables['Build.Reason'], 'Schedule')) }}
    publishPackages: ${{ parameters.publishPackages }}
    deployDocs: ${{ parameters.deployDocs }}
